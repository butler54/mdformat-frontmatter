[tox]
envlist = py{310,311,312,313,314,315}
isolated_build = True

[testenv:py{310,311,312,313,314,315}]
extras = test
commands = pytest -vv {posargs}

[testenv:py{310,311,312,313,314,315}-cov]
extras = test
commands = pytest --cov={envsitepackagesdir}/mdformat_frontmatter {posargs}

[testenv:py{310,311,312,313,314,315}-pre-commit]
extras = dev
commands = pre-commit run {posargs}

[testenv:py{310,311,312,313,314,315}-hook]
extras = dev
commands = pre-commit run --config .pre-commit-test.yaml {posargs:--all-files --verbose --show-diff-on-failure}
